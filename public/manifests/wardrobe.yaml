version: 1

characters:
  female:
    id: "female"
    name: "Female"
    baseImage: "/characters/female/female1.png"
    canvas:
      width: 420
      height: 640
    anchors:
      head:   { x: 210, y: 70 }
      torso:  { x: 210, y: 220 }
      bottom: { x: 210, y: 380 }
      feet:   { x: 210, y: 560 }
  male:
    id: "male"
    name: "Male"
    baseImage: "/characters/male/male.png"
    canvas:
      width: 420
      height: 640
    anchors:
      head:   { x: 210, y: 70 }
      torso:  { x: 210, y: 220 }
      bottom: { x: 210, y: 380 }
      feet:   { x: 210, y: 560 }


categoryOrder:
  - top
  - bottom
  - outer
  - item

categoryDefaults:
  head:
    width: 150
    height: 150
    layer: 10
    anchor: "head"
    offset: { x: 0, y: 0 }
    scale: 1
  top:
    width: 150
    height: 150
    layer: 10
    anchor: "torso"
    offset: { x: 0, y: 0 }
    scale: 1
  bottom:
    width: 150
    height: 150
    layer: 10
    anchor: "bottom"
    offset: { x: 0, y: 0 }
    scale: 1
  outer:
    width: 160
    height: 220
    layer: 50
    anchor: "torso"
    offset: { x: 0, y: 0 }
    scale: 1
  shoes:
    width: 120
    height: 100
    layer: 10
    anchor: "feet"
    offset: { x: 0, y: 0 }
    scale: 1
  item:
    width: 80
    height: 80
    layer: 60
    anchor: "head"
    offset: { x: 0, y: 0 }
    scale: 1

